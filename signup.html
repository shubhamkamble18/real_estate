<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMELUXE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="images/x-icon" href="images/logo.ico">
    <script src="https://kit.fontawesome.com/e2d5ca08ae.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <section class="login-page">
        <div class="login-box">
            <h2>Create Account in Home<span>Luxe</span></h2>
            <form >
                <input type="name" placeholder="Enter your Name" required>
                
                <input type="email" placeholder="Enter your email" required>
                
                <input type="password" placeholder=" Enter your password " required>
                
                <input type="password" placeholder="confirm password " required>
                <button>Login</button>
                <p>Already Having An Account <a href="login.html">Login</a></p>
            </form>
        </div>
    </section>
</body>
</html>
