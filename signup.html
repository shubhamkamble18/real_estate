<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMELUXE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="images/x-icon" href="images/logo.ico">
    <script src="https://kit.fontawesome.com/e2d5ca08ae.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
      <nav class="login-navbar">
      <a href="index.html" class="login-logo"> HOMELUXE </a>

      <a href="index.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Home
      </a>
    </nav>
    <section class="login-page " style="display: flex; justify-content: flex-end; ">
        <div class="login-box" style="justify-content: center;margin-right:10px ">
            <h2>Create Account in Home<span>Luxe</span></h2>
            <form >
                <label >Enter name</label>
                <input type="name" placeholder="Enter your Name" required>
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
                <label>Password</label>
                <input type="password" placeholder=" Enter your password " required>
                <label>Confirm Password</label>
                <input type="password" placeholder="confirm password " required>
                <button>Login</button>
                <p style="text-align: center;">Already Having An Account <a href="login.html" style="color:#d4af37;text-decoration:none;font-weight:600;"
                     >Login</a></p>
            </form>
        </div>
    </section>
</body>
</html>
